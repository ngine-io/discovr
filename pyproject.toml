[project]
name = "discovr-ngine"
version = "0.1.0"
description = "HTTP service discovery for Prometheus, backed by cloud provider APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rene Moser", email = "mail@renemoser.net" }]
keywords = ["prometheus", "service-discovery", "cloudscale", "exoscale", "cloudstack"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "cloudscale-sdk>=0.7",
    "cs>=5",
    "fastapi>=0.115",
    "jmespath>=1",
    "loguru>=0.7",
    "pydantic>=2",
    "pydantic-settings>=2",
    "requests>=2.31",
    "requests-exoscale-auth>=1.1",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/ngine-io/discovr"
Source = "https://github.com/ngine-io/discovr"
Issues = "https://github.com/ngine-io/discovr/issues"

[project.scripts]
discovr = "discovr.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discovr"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
    "PL",     # pylint
    "D",      # pydocstyle
]
ignore = [
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "PLR2004", # magic values are fine in tests and status codes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
source = ["discovr"]
branch = true
